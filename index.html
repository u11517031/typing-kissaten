<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打喫茶店版本紀錄 (Version Portal)</title>
    <style>
        :root {
            --bg-color: #f4ece1;
            --main-color: #8c2d19;
            --accent-color: #d99b26;
            --text-color: #362212;
            --card-bg: #fff8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 3px solid var(--main-color);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--main-color);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--main-color);
            margin-top: 0;
            border-bottom: 2px dashed var(--accent-color);
            padding-bottom: 10px;
            text-shadow: 1px 1px 0px var(--accent-color);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 30px;
        }

        .version-card {
            background: #e8d8c8;
            border: 2px solid var(--main-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.15s ease;
        }

        .version-card:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px var(--main-color);
        }

        .version-info {
            flex: 1;
            padding-right: 15px;
        }

        .version-tag {
            display: inline-block;
            background: var(--main-color);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .version-date {
            font-size: 0.85rem;
            color: #666;
            margin-left: 8px;
        }

        .version-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        .play-btn {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 2px solid var(--main-color);
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 2px 2px 0px var(--main-color);
        }

        .play-btn:hover {
            background: #c78a1f;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            background: #2e7d32;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>☕《英打喫茶店》版本紀錄</h1>
        <div class="subtitle">Show Typing Kissaten — Version History Portal</div>

        <!-- 原型 v1.0 -->
        <div class="version-card">
            <div class="version-info">
                <div>
                    <span class="version-tag">v1.0.0</span>
                    <span class="version-date">2026-09-25</span>
                </div>
                <p class="version-desc">
                    基礎英文打字機制、菜單顯示與點餐計分原型開發。
                </p>
            </div>
            <!-- 指向 v1.0 資料夾內部的遊戲 -->
            <a href="./v1.0/" class="play-btn" target="_blank">🎮 試玩此版本</a>
        </div>

    </div>

</body>
</html>
